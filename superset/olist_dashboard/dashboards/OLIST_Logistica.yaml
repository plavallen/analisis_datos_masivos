css: "/* OLIST Log\xEDstica \u2014 Dashboard CSS\n   Tipograf\xEDa IBM Plex Sans/Mono,\
  \ paleta #1F5FC4/#B8571B/#5A6270 */\n@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap');\n\
  \n/* \u2500\u2500 Tipograf\xEDa base \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500 */\nbody,\n.dashboard,\n.ant-typography,\n.ant-tabs {\n  font-family: 'IBM\
  \ Plex Sans', sans-serif !important;\n}\n\n/* \u2500\u2500 Fondo del dashboard \u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500 */\n.dragdroppable-content {\n  background: #F4F5F7 !important;\n\
  }\n\n/* \u2500\u2500 Tarjeta de gr\xE1fico \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n\
  .chart-slice .chart-container,\n.slice_container {\n  background: #FFFFFF !important;\n\
  \  border: 1px solid #E1E4EA !important;\n  border-radius: 12px !important;\n  box-shadow:\
  \ none !important;\n}\n\n/* \u2500\u2500 T\xEDtulo del gr\xE1fico \u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500 */\n.chart-slice .chart-header .header-title,\n.slice_header\
  \ .header-title,\n.slice-header .header-title {\n  font-size: 15px !important;\n\
  \  font-weight: 600 !important;\n  color: #1B1F24 !important;\n  font-family: 'IBM\
  \ Plex Sans', sans-serif !important;\n}\n\n/* \u2500\u2500 Textos secundarios \u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500 */\n.chart-slice .chart-header,\n.slice_header,\n\
  .chart-slice .metadata {\n  color: #5A6270 !important;\n}\n\n/* \u2500\u2500 Pesta\xF1\
  as activas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.ant-tabs-tab.ant-tabs-tab-active\
  \ .ant-tabs-tab-btn {\n  color: #1F5FC4 !important;\n  font-weight: 600 !important;\n\
  }\n.ant-tabs-ink-bar {\n  background: #1F5FC4 !important;\n}\n.ant-tabs-tab .ant-tabs-tab-btn\
  \ {\n  color: #5A6270 !important;\n}\n\n/* \u2500\u2500 Big Number \u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.chart-slice\
  \ .chart-container .big-number-container {\n  padding: 12px 16px !important;\n}\n\
  .chart-slice .chart-container .big-number {\n  font-size: 2rem !important;\n  font-weight:\
  \ 600 !important;\n  color: #1B1F24 !important;\n  font-family: 'IBM Plex Mono',\
  \ monospace !important;\n}\n.chart-slice .chart-container .subheader {\n  font-size:\
  \ 12px !important;\n  color: #5A6270 !important;\n}\n\n/* \u2500\u2500 Tablas \u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500 */\n.dt-cell-value,\n.dt-cell-value--numeric {\n  font-family:\
  \ 'IBM Plex Mono', monospace !important;\n  font-size: 13px !important;\n}\n.dt-cell-value--numeric\
  \ {\n  text-align: right !important;\n}\n\n/* \u2500\u2500 Componentes Markdown\
  \ (subt\xEDtulos de pesta\xF1a) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \ */\n.dragdroppable--markdown p {\n  color: #5A6270 !important;\n  font-size: 13px\
  \ !important;\n  margin: 0 !important;\n  padding: 4px 0 !important;\n}\n\n\n/*\
  \ KPI sparkline: sin barra de desplazamiento interna */\n.chart-slice .chart-container\
  \ { overflow: hidden !important; }\n\n/* \u2500\u2500 KPI Handlebars cards \u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
  \u2500\u2500\u2500 */\n.kpi-card {\n  padding: 10px 14px;\n  height: calc(100% -\
  \ 2px);\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  box-sizing:\
  \ border-box;\n  font-family: 'IBM Plex Sans', sans-serif;\n}\n.kpi-label {\n  font-size:\
  \ 11px;\n  font-weight: 600;\n  color: #5A6270;\n  text-transform: uppercase;\n\
  \  letter-spacing: .4px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space:\
  \ nowrap;\n}\n.kpi-value {\n  font-size: 2rem;\n  font-weight: 600;\n  font-family:\
  \ 'IBM Plex Mono', monospace;\n  color: #1B1F24;\n  line-height: 1.2;\n  margin:\
  \ 4px 0 2px;\n}\n.kpi-value--primary { color: #1F5FC4; }\n.kpi-value--alert   {\
  \ color: #B8571B; }\n.kpi-note {\n  font-size: 11px;\n  color: #5A6270;\n  margin-bottom:\
  \ 4px;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n\
  }\n.kpi-spark {\n  width: 100%;\n  height: 36px;\n  flex-shrink: 0;\n}\n.kpi-spark-line\
  \ {\n  fill: none;\n  stroke-width: 2.5;\n  stroke-linecap: round;\n  stroke-linejoin:\
  \ round;\n}\n.kpi-spark-line--primary { stroke: #1F5FC4; }\n.kpi-spark-line--alert\
  \   { stroke: #B8571B; }\n\n/* === Slice 32: tabla de pedidos en riesgo === */\n\
  #chart-id-32 .table {\n  table-layout: fixed !important;\n  width: auto !important;\n\
  }\n/* Ocultar riesgo_num: visibility:collapse en col evita el desplazamiento de\
  \ nth-child */\n#chart-id-32 col:nth-child(1) {\n  visibility: collapse !important;\n\
  \  width: 0 !important;\n}\n/* Nivel: 90px */\n#chart-id-32 col:nth-child(2) { width:\
  \ 90px !important; }\n/* Riesgo relativo: 120px */\n#chart-id-32 col:nth-child(3)\
  \ { width: 120px !important; }\n/* D\xEDas hasta la promesa: 110px */\n#chart-id-32\
  \ col:nth-child(4) { width: 110px !important; }\n/* Ruta: 90px */\n#chart-id-32\
  \ col:nth-child(5) { width: 90px !important; }\n/* Categor\xEDa: 220px fijo; sobrante\
  \ del chart queda a la derecha */\n#chart-id-32 col:nth-child(6) { width: 220px\
  \ !important; }\n/* Vendedor: 90px */\n#chart-id-32 col:nth-child(7) { width: 90px\
  \ !important; }\n/* Pedido: 90px */\n#chart-id-32 col:nth-child(8) { width: 90px\
  \ !important; }\n/* Fecha prometida: 110px */\n#chart-id-32 col:nth-child(9) { width:\
  \ 110px !important; }\n/* Truncar texto en celdas angostas */\n#chart-id-32 .table\
  \ td {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n\
  }"
