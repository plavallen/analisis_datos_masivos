slice_name: "Descomposici\xF3n del cambio en la tasa de tard\xEDos"
description: "Cada barra muestra el cambio en la tasa de tard\xEDos respecto al mes\
  \ anterior (referencia: SUM(w0\xB7p0) sobre grupos con datos en ambos meses). La\
  \ suma de los efectos es algebraicamente igual al delta exacto."
