tablas:

  silver.geo_cep:
    capa: silver
    descripcion: "Centroide por prefijo postal (mediana lat/lng sobre puntos limpios de geolocation)"
    columnas:
      zip:
        tipo: string
        descripcion: "Prefijo postal de 5 dígitos normalizado"
        origen: bronze.geolocation
        disponible_al_comprar: true
      n_puntos:
        tipo: integer
        descripcion: "Cantidad de registros usados para calcular el centroide"
        origen: derivado
        disponible_al_comprar: true
      lat_med:
        tipo: double
        descripcion: "Latitud mediana del prefijo"
        origen: derivado
        disponible_al_comprar: true
      lng_med:
        tipo: double
        descripcion: "Longitud mediana del prefijo"
        origen: derivado
        disponible_al_comprar: true
      geo_confianza:
        tipo: string
        descripcion: "ok si n_puntos >= 3, baja en caso contrario"
        origen: derivado
        disponible_al_comprar: true

