        disponible_al_comprar: true
      flete_total:
        tipo: double
        descripcion: "Suma de freight_value de todos los ítems del pedido"
        origen: derivado
        disponible_al_comprar: true
      gmv:
        tipo: double
        descripcion: "precio_total + flete_total"
