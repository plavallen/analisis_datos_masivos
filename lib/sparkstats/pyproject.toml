[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkstats"
version = "0.1.0"
description = "Utilidades estadísticas reutilizables sobre PySpark DataFrames"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=4.0",
    "plotly>=5.0",
    "kaleido>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
